name: Feature Request
description: 'Share your ideas for Eclipse Launcher'
labels: [Suggestion]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: |
        Please describe your idea in detail here.
    validations:
      required: true

  - type: textarea
    id: more-info
    attributes:
      label: Additional Information
      description: |
        If possible, you can also provide images to help better understand your idea.
    validations:
      required: false

  - type: checkboxes
    id: check-issue
    attributes:
      label: This feature request has not been proposed before
      options:
        - label: I have checked the Issues and found no similar feature request
          required: true
