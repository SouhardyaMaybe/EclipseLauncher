name: Bug Report
description: 'Report a bug in Eclipse Launcher'
labels: [Bug]
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      options:
        - 'Game Issue'
        - 'Launcher Issue'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: |
        Clearly and in detail describe the issue you encountered.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log File
      description: |
        Please upload the log file from the most recent occurrence of the issue here. This helps quickly pinpoint the problem.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Videos
      description: |
        Upload screenshots or videos from the most recent occurrence of the issue. This may help identify the problem faster.
    validations:
      required: false

  - type: textarea
    id: repetition
    attributes:
      label: Reproduction Steps
      description: |
        Steps to reproduce the issue. Please be as detailed as possible to help locate the problem quickly.
      placeholder: |
        1. xxx
        2. xxx
        ... *(steps to reproduce the issue)*
      render: markdown
    validations:
      required: false

  - type: dropdown
    id: android-version
    attributes:
      label: Android Version
      description: |
        Eclipse Launcher does not support running on devices with Android 7 or lower!
      options:
        - '16'
        - '15'
        - '14'
        - '13'
        - '12'
        - '11'
        - '10'
        - '9'
        - '8'
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: |
        Which version of Eclipse Launcher did you encounter this issue in? You can check this on the "About" page.
      placeholder: 1.4.1.2
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: Selected Renderer
      description: |
        The renderer might be the root cause of the issue. If this is not a game-related problem, please ignore this field and leave it blank. (Issues caused by renderer plugins are not supported.)
      options:
        - 'GL4ES'
        - 'Vulkan Zink'
        - 'VirGLRenderer'
        - 'Freedreno'
        - 'Panfrost'
        - 'Mobile Glues'
    validations:
      required: false

  - type: input
    id: device-info
    attributes:
      label: Device Information
      description: |
        Providing detailed information about the device will help troubleshoot the issue.
      placeholder: Android 11, arm64
    validations:
      required: true

  - type: checkboxes
    id: check-issue
    attributes:
      label: This issue has not been reported before
      options:
        - label: I have checked the Issues and found no similar issue reported
          required: true
