name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  BuildRelease:
    if: github.repository_owner == 'SouhardyaMaybe' && !startsWith(github.ref, 'refs/pull/') && (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ "all", "arm", "arm64", "x86", "x86_64" ]
      fail-fast: false

    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build type
        id: set-env
        run: |
          # Build type is driven by the REF, never by commit messages:
          # a pushed version tag produces RELEASE builds, everything else
          # (main pushes, dispatches, PR validation) stays DEBUG.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" == *pre* ]]; then
              echo "ECLIPSE_BUILD_TYPE=PRE_RELEASE" >> $GITHUB_ENV
            else
              echo "ECLIPSE_BUILD_TYPE=RELEASE" >> $GITHUB_ENV
            fi
          else
            echo "ECLIPSE_BUILD_TYPE=DEBUG" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Release ${{ matrix.arch }}
        env:
          ECLIPSE_KEYSTORE_PASSWORD: ${{ secrets.ECLIPSE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew EclipseLauncher:assemblerelease -Darch=${{ matrix.arch }}

      - name: Stage APK for release publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: EclipseLauncher/build/outputs/apk/release/*
          if-no-files-found: error

  PublishRelease:
    needs: BuildRelease
    if: github.repository_owner == 'SouhardyaMaybe' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Determine release kind from tag
        run: |
          # Tag-driven publishing: the pushed tag IS the release identity.
          # "v1.2.3" -> release; any tag containing "pre" -> pre-release.
          if [[ "$GITHUB_REF_NAME" == *pre* ]]; then
            echo "prerelease=true" >> $GITHUB_ENV
          else
            echo "prerelease=false" >> $GITHUB_ENV
          fi

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Eclipse Launcher ${{ github.ref_name }}
          prerelease: ${{ env.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.apk

  BuildDebug:
    if: startsWith(github.ref, 'refs/pull/') || (github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ "all", "arm", "arm64", "x86", "x86_64" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Debug ${{matrix.arch}}
        run: |
          chmod +x gradlew
          ./gradlew EclipseLauncher:assembleDebug -Darch=${{ matrix.arch }}

      - name: Upload Debug ${{matrix.arch}}
        uses: actions/upload-artifact@v4
        with:
          name: EclipseLauncher(Debug) ${{ matrix.arch }}
          path: EclipseLauncher/build/outputs/apk/debug/*
