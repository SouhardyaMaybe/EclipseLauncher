name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  ANDROID_PLATFORM: 'platforms;android-37.2'
  BUILD_TOOLS: 'build-tools;36.0.0'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "$ANDROID_PLATFORM" "$BUILD_TOOLS" "platform-tools"
          # AGP resolves the API 37 platform under its minor-level directory.
          ln -sfn "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37" || true

      - name: Run Lint
        run: ./gradlew lint

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results*.html
            app/build/intermediates/lint_intermediate_text_report/**/lint-results-debug.txt

  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "$ANDROID_PLATFORM" "$BUILD_TOOLS" "platform-tools"
          ln -sfn "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37" || true

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  assemble-release:
    name: Assemble Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "$ANDROID_PLATFORM" "$BUILD_TOOLS" "platform-tools"
          ln -sfn "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37" || true

      - name: Assemble Release
        run: ./gradlew bundleRelease

      - name: Upload Release AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
