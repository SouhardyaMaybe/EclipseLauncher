name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs and provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate dossier
        run: python3 scripts/check-docs.py
      - name: Reject forbidden components
        run: bash scripts/check-provenance.sh

  detect:
    name: Detect source layout
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.check.outputs.app }}
      jni: ${{ steps.check.outputs.jni }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          echo "app=$(test -f app/build.gradle.kts && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "jni=$(find app/src/main/jniLibs -name '*.so' -print -quit 2>/dev/null | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"

  android:
    name: Android build
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Compile the JVM core and its tests
        run: gradle :core:common:test --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: 16 KB native and zip gate
        if: needs.detect.outputs.jni == 'true'
        run: |
          python3 scripts/check-elf-alignment.py --dir app/src/main/jniLibs
          python3 scripts/check-elf-alignment.py --zip app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: eclipse-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
