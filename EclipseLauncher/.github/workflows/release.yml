name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify, but do not create a GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect source layout
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: check
        run: echo "app=$(test -f app/build.gradle.kts && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build release APK
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "9.6.0"
      - name: Require release signing material
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE: ${{ secrets.ECLIPSE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "ECLIPSE_KEYSTORE_BASE64 is not configured; refusing to publish an unsigned release" >&2
            exit 1
          fi
      - name: Assemble release APK
        env:
          ECLIPSE_KEYSTORE_BASE64: ${{ secrets.ECLIPSE_KEYSTORE_BASE64 }}
          ECLIPSE_KEYSTORE_PASSWORD: ${{ secrets.ECLIPSE_KEYSTORE_PASSWORD }}
          ECLIPSE_KEY_ALIAS: ${{ secrets.ECLIPSE_KEY_ALIAS }}
          ECLIPSE_KEY_PASSWORD: ${{ secrets.ECLIPSE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify the release APK
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          python3 scripts/check-apk-manifest.py "$apk" \
            --app-id dev.shadow.eclipselauncher --release
          python3 scripts/check-elf-alignment.py --zip "$apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eclipse-launcher-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [detect, build]
    if: needs.detect.outputs.app == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: eclipse-launcher-release
          path: dist
      - name: Generate checksums and manifest
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          tag = os.environ["TAG"]
          files = []
          for p in sorted(pathlib.Path(".").glob("*.apk")):
              files.append({"name": p.name, "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "size": p.stat().st_size})
          manifest = {
              "component": "eclipse-launcher",
              "version": tag,
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "built_at": subprocess.check_output(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], text=True).strip(),
              "runner": os.environ.get("RUNNER_OS", "Linux"),
              "artifacts": files,
          }
          pathlib.Path("BUILD-MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          sha256sum BUILD-MANIFEST.json >> SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt dist/BUILD-MANIFEST.json \
            --title "Eclipse Launcher $TAG" \
            --notes-file docs/release-notes.md \
            --verify-tag
