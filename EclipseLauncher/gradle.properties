# Kotlin and Android build settings.
#
# AGP 9.4 ships built-in Kotlin at the version it depends on (2.2.10). This
# project pins Kotlin 2.4.21, so the AGP built-in compiler is disabled and the
# Kotlin Android plugin is applied explicitly. AGP 9.4 requires the legacy DSL
# while the Kotlin Android plugin is in use. Both switches are temporary and
# must be revisited when AGP 10 makes the new DSL mandatory.
android.builtInKotlin=false
android.newDsl=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
